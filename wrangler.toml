name = "reservation-en-ligne"
main = "src/worker.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Les pages du dossier public/ sont servies telles quelles ;
# le Worker ne répond qu'aux adresses /api/*
[assets]
directory = "./public"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cours-db"
database_id = "65661c40-ac3d-4b3e-9436-be46ca4219ce"
